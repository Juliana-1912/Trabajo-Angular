<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title>Iniciar sesión</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>Presiona el botón para iniciar sesión.</p>
    <p class="mensaje">{{ mensaje }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="ingresar()">Ingresar</button>
  </mat-card-actions>
</mat-card>
